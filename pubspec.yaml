name: focustime
description: "FocusTime Routine: Daily Routine & Pomodoro Flow"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.6
  path: ^1.9.1
  path_provider: ^2.1.6
  audioplayers: ^6.8.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    - assets/data/
    - assets/images/
